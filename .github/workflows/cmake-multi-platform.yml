name: Build XMRig 0% Fee (Win & Ubuntu x64)

on:
  workflow_dispatch:

jobs:
  # ---------------- Windows x64 编译任务 ----------------
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 使用你提供的指定版本标签直接下载 xmrig-deps
      - name: Download and Extract xmrig-deps
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/xmrig/xmrig-deps/archive/refs/tags/v25.06.16.zip" -OutFile "xmrig-deps.zip"
          Expand-Archive -Path "xmrig-deps.zip" -DestinationPath "deps_extracted"
          
          # 动态匹配并获取解压目录下的 msvc2022\x64 路径
          $depsPath = (Get-ChildItem -Path "deps_extracted" -Filter "x64" -Recurse -Directory | Where-Object { $_.Parent.Name -eq "msvc2022" }).FullName
          Write-Host "Target deps path: $depsPath"
          "XMRIG_DEPS_PATH=$depsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and Build
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 "-DXMRIG_DEPS=$env:XMRIG_DEPS_PATH"
          cmake --build . --config Release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-windows-x64-0fee
          path: build/Release/xmrig.exe

  # ---------------- Ubuntu x64 编译任务 ----------------
  build-ubuntu:
    name: Build Ubuntu x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libuv1-dev libssl-dev libhwloc-dev

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Upload Ubuntu Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-ubuntu-x64-0fee
          path: build/xmrig
