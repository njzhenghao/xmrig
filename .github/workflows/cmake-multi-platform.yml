name: Build XMRig 0% Fee (Win & Ubuntu x64)

on:
  workflow_dispatch:

jobs:
  # ---------------- Windows x64 编译任务 ----------------
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64
          cmake --build . --config Release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-windows-x64-0fee
          path: build/Release/xmrig.exe

  # ---------------- Ubuntu x64 编译任务 ----------------
  build-ubuntu:
    name: Build Ubuntu x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libuv1-dev libssl-dev libhwloc-dev

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Upload Ubuntu Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-ubuntu-x64-0fee
          path: build/xmrig
