name: Build XMRig 0% Fee (Win & Ubuntu x64)

on:
  workflow_dispatch:

jobs:
  # ---------------- Windows x64 编译任务 ----------------
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 自动检索并下载预编译的二进制依赖库（包含 .lib 和 .h 库文件）
      - name: Download and Extract xmrig-deps
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/xmrig/xmrig-deps/releases"
          $response = Invoke-RestMethod -Uri $apiUrl
          $downloadUrl = $null

          foreach ($release in $response) {
              $asset = $release.assets | Where-Object { $_.name -like "*win64-msvc2022.zip" -or $_.name -like "*win64*.zip" } | Select-Object -First 1
              if ($asset) {
                  $downloadUrl = $asset.browser_download_url
                  Write-Host "Found prebuilt deps asset: $($asset.name)"
                  break
              }
          }

          if (-not $downloadUrl) {
              $downloadUrl = "https://github.com/xmrig/xmrig-deps/releases/download/v6.2.0/xmrig-deps-6.2.0-win64-msvc2022.zip"
          }

          Write-Host "Downloading from: $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "xmrig-deps.zip"
          Expand-Archive -Path "xmrig-deps.zip" -DestinationPath "deps_extracted" -Force

          # 自动定位包含 include 和 lib 文件夹的完整依赖目录
          $depsDir = Get-ChildItem -Path "deps_extracted" -Recurse -Directory | Where-Object { 
              (Test-Path (Join-Path $_.FullName "include")) -and (Test-Path (Join-Path $_.FullName "lib"))
          } | Select-Object -First 1

          if (-not $depsDir) {
              $depsDir = Get-ChildItem -Path "deps_extracted" -Filter "x64" -Recurse -Directory | Select-Object -First 1
          }

          if (-not $depsDir) {
              Write-Error "FATAL: Could not locate valid x64 dependencies directory!"
              exit 1
          }

          $depsPath = $depsDir.FullName
          Write-Host "Validated XMRIG_DEPS_PATH: $depsPath"
          "XMRIG_DEPS_PATH=$depsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and Build
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 "-DXMRIG_DEPS=$env:XMRIG_DEPS_PATH"
          cmake --build . --config Release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-windows-x64-0fee
          path: build/Release/xmrig.exe

  # ---------------- Ubuntu x64 编译任务 ----------------
  build-ubuntu:
    name: Build Ubuntu x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libuv1-dev libssl-dev libhwloc-dev

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Upload Ubuntu Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-ubuntu-x64-0fee
          path: build/xmrig
