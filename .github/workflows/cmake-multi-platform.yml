name: Build XMRig 0% Fee (Win & Ubuntu x64)

on:
  workflow_dispatch:

jobs:
  # ---------------- Windows x64 编译任务 ----------------
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 直接克隆 xmrig-deps 依赖仓库（包含 msvc2022/x64 预编译静态库）
      - name: Clone xmrig-deps
        run: git clone --depth 1 https://github.com/xmrig/xmrig-deps.git xmrig-deps

      - name: Configure and Build
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DXMRIG_DEPS="${{ github.workspace }}/xmrig-deps/msvc2022/x64"
          cmake --build . --config Release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-windows-x64-0fee
          path: build/Release/xmrig.exe

  # ---------------- Ubuntu x64 编译任务 ----------------
  build-ubuntu:
    name: Build Ubuntu x64
    needs: build-windows   # 依赖约束：仅当 Windows 编译成功后才启动，Win 失败直接终止工作流
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libuv1-dev libssl-dev libhwloc-dev

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Upload Ubuntu Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-ubuntu-x64-0fee
          path: build/xmrig
